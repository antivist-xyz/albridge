
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "albridge"
version = "0.1.0"
description = "Cross-venue liquidity translation and market-making prototype for Antivist Markets"
requires-python = ">=3.11"

dependencies = [
    "antivist-python @ git+https://github.com/antivist-xyz/antivist-python.git",
    "httpx>=0.27,<1",
    "websocket-client>=1.8,<2",
    "certifi>=2025.0",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]